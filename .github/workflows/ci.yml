name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only: builds of pull requests cannot change the repository.
permissions:
  contents: read

jobs:
  core:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: core
    steps:
      # Pinned to a commit so a moved tag cannot swap in different code (v4).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Toolchain
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  app:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # v6.1.0; the SDK version comes from app/global.json.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: app/global.json
      - name: Test logic
        run: dotnet test BatteryLife.Logic.Tests
      - name: Build app
        run: dotnet build BatteryLife.App -c Release -r win-x64 -p:Platform=x64 -warnaserror
      - name: Smoke test (app starts and stays up)
        shell: pwsh
        run: ./tools/smoke.ps1 (Get-ChildItem BatteryLife.App/bin/x64/Release -Recurse -Filter BatteryLife.exe | Select-Object -First 1).FullName
