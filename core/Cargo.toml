[package]
name = "batterylife-core"
version = "0.1.0"
edition = "2024"
# let-chains (`if let .. && let ..`) need 1.88
rust-version = "1.88"

[dependencies]
hidapi = "2.6.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Devices_HumanInterfaceDevice", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Com", "Win32_UI_Input_XboxController", "Gaming_Input", "Devices_Power", "System_Power", "Foundation", "Foundation_Collections"] }
